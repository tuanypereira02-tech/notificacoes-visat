="true"><path d="M16 28 4 16C-2 6 10 1 16 9c6-8 18-3 12 7zM16 10l-3 6 5 4-3 6"/></svg></span>Carga psíquica</span><span class="risk-back" id="risk-back-6"><strong>Carga psíquica</strong><span>Escute como a pessoa vivencia as relações e situações de trabalho. Registre as exigências emocionais e os fatores da organização.</span></span></button><button type="button" data-risk="7" aria-label="Carga cognitiva" aria-pressed="false"><span class="risk-front"><span class="risk-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 24V13a9 9 0 0 1 18 0v5l4 3h-6v8H11M13 10h7M13 15h5M13 20h4"/></svg></span>Carga cognitiva</span><span class="risk-back" id="risk-back-7"><strong>Carga cognitiva</strong><span>Observe atenção, memória, processamento de informações e decisões. Considere recursos, tempo e interrupções.</span></span></button></div></main></div></div><script>document.querySelectorAll('[data-risk]').forEach(button=>{button.addEventListener('click',()=>{const turn=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(turn));const detail=button.querySelector('.risk-back');if(turn)button.setAttribute('aria-describedby',detail.id);else button.removeAttribute('aria-describedby');});});</script></div><div data-visat-moldura="rodape"><template shadowrootmode="open"><link rel="stylesheet" href="../assets/moldura-visat.css"><footer class="landmark"><img class="panorama" src="../assets/ponte.png" alt="Ponte Hercílio Luz ao entardecer, em Florianópolis" width="1536" height="512" loading="lazy"><div class="caption"><div class="caption-inner"><div class="org"><strong>Vigilância em Saúde do Trabalhador</strong><span>Secretaria Municipal de Saúde de Florianópolis</span></div><div class="visat-credito"><div class="credito-container" tabindex="0" aria-label="Créditos: Desenvolvido por Tuany Pereira"><span class="txt">Desenvolvido por Tuany Pereira</span><span class="icone-info" aria-hidden="true">i</span></div></div><!--/visat-credito--></div></div
