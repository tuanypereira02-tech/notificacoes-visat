name: Base local de empresas (Receita Federal)

# Atualiza data/empresas-locais/ com os dados abertos do CNPJ do mês mais recente.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 20 * *'   # dia 20 de cada mês (a Receita publica no início do mês)
  push:
    branches-ignore: [main]
    paths:
      - scripts/gerar-base-empresas.py
      - .github/workflows/base-empresas.yml

permissions:
  contents: write

concurrency:
  group: base-empresas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Gerar base
        run: python scripts/gerar-base-empresas.py
      - name: Gravar no repositório
        run: |
          git config user.name "VISAT base de empresas"
          git config user.email "actions@users.noreply.github.com"
          git add data/empresas-locais
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -m "Base local de empresas: $(python -c "import json;print(json.load(open('data/empresas-locais/indice.json'))['referencia'])")"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
